name: games
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - run: npm install --prefix sudoku --ignore-scripts --no-package-lock
      - run: node sudoku/node_modules/playwright/cli.js install --with-deps chromium
      - run: node scripts/serve.mjs > /tmp/games-server.log 2>&1 &
      - run: npm run test:site
      - run: npm run test:circuit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-checks
          path: test-results/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
