<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f4">
  <meta name="description" content="sudoku. Point at a puzzle and hold steady to solve. A minimal browser-only sudoku solver for desktop and mobile.">
  <title>sudoku</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <header><h1>sudoku<span aria-hidden="true">.</span></h1></header>
    <div class="toolbar">
      <button id="camera" class="camera-button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 6l1.5-2h5L16 6h4v14H4V6z"/><circle cx="12" cy="12.5" r="3.5"/></svg>Scan puzzle</button>
      <button id="upload" class="text-button">Upload photo <span aria-hidden="true">↗</span></button>
      <input type="file" id="photo" accept="image/*" hidden>
      <input type="file" id="native-camera" accept="image/*" capture="environment" hidden>
    </div>
    <div class="board-wrap"><div id="board" role="group" aria-label="sudoku puzzle. Enter digits 1 to 9. Use arrow keys to move."></div></div>
    <div class="board-caption"><button id="undo" class="text-button" hidden>Back to puzzle</button><button id="clear" class="text-button">Clear</button></div>
    <button id="solve" class="primary solve-button">Solve <span aria-hidden="true">→</span></button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
  <dialog id="scan-dialog" aria-labelledby="scan-title">
    <div class="dialog-heading"><h2 id="scan-title">Scan puzzle</h2><button id="close-scan" class="icon-button" aria-label="Close scanner">×</button></div>
    <p id="scan-help">Fit the whole puzzle in the frame.</p>
    <div id="viewfinder"><video id="video" autoplay muted playsinline></video><canvas id="camera-guide" aria-hidden="true"></canvas><canvas id="crop" hidden aria-label="Puzzle photo. Drag the four corner handles to align the grid."></canvas></div>
    <div id="crop-tools" hidden><button id="rotate" class="text-button">Rotate ↻</button><button id="retake" class="text-button">Choose another photo</button></div>
    <progress id="progress" max="81" value="0" hidden aria-label="Reading puzzle"></progress>
    <p id="scan-status" role="status" aria-live="polite"></p>
    <button id="capture" class="primary">Take photo</button>
    <button id="read" class="primary" hidden>Read grid <span aria-hidden="true">→</span></button>
    <button id="camera-upload" class="text-button camera-upload">Use a photo instead</button>
  </dialog>
</body>
</html>
