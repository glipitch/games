<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="theme-color" content="#eef2f6">
 <meta name="description" content="Circuit: six ways to connect the power. Unlimited puzzles from 3×3 to 10×10, with hints, pins and saved progress.">
 <title>Circuit — Little Clicks</title>
 <link rel="icon" href="./glimwire-icon.svg"><link rel="stylesheet" href="./circuit.css?v=8">
 <script type="module" src="./circuit.js?v=8"></script>
</head>
<body>
 <div class="circuit-shell">
  <header><a class="circuit-brand" href="./circuit.html"><span aria-hidden="true">ϟ</span>Circuit</a><button id="settings-toggle" aria-haspopup="dialog" aria-controls="puzzle-settings" aria-label="Puzzle settings"><span id="settings-summary">Classic · 5×5</span><span aria-hidden="true">⌄</span></button></header>
  <main>
   <section class="game" aria-label="Circuit puzzle">
    <div class="game-body">
     <div class="play-heading"><h1 id="goal">Power every tile.</h1><div class="metrics"><div><strong id="powered">0/25</strong><span>powered</span></div><div><strong id="moves">0</strong><span>moves</span></div></div></div>
     <span class="variant-badge" id="variant-badge" hidden>Classic</span>
     <div class="board-area">
      <div class="board-viewport" id="board-viewport" tabindex="0" aria-label="Circuit board. Scroll to explore when enlarged."><div class="board" id="board" role="group" aria-label="Circuit tiles"></div></div>
      <p id="board-tip" hidden></p>
     </div>
     <div class="tools" id="tools"><button id="undo" disabled>↶ Undo</button><button id="pin-mode" aria-pressed="false" title="Pin tiles in place (P on a focused tile)">Pin tiles</button><button id="hint">✧ Hint</button></div>
     <div class="live-state" id="status" role="status" hidden></div>
     <p id="hint-message" role="status" hidden></p>
     <div id="result" hidden></div>
    </div>
   </section>
   <p class="play-foot" id="save-status" hidden></p>
   <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  </main>
 </div>
 <dialog id="puzzle-settings" aria-labelledby="settings-title">
  <div class="modal-top"><div><h2 id="settings-title">Your puzzle</h2><p id="puzzle-label">Unlimited puzzles</p></div><button id="close-settings" class="round-button" aria-label="Return to puzzle">×</button></div>
  <div class="variant-tabs" id="variants" role="group" aria-label="Circuit mode"></div>
  <div class="settings-row"><div class="size-control"><label for="size">Board size</label><select id="size" aria-label="Board size"></select></div><div class="zoom-controls" role="group" aria-label="Board zoom"><button id="zoom-out" aria-label="Zoom out">−</button><button id="fit" aria-label="Fit board to width">Fit</button><button id="zoom-in" aria-label="Zoom in">+</button></div></div>
  <div class="state-key" id="legend"></div>
  <button id="new" class="new-button">↻ New puzzle</button>
  <div class="settings-actions"><button id="reset">Restart puzzle</button><button id="help">How to play</button><a class="all-games" href="./games.html">All games</a></div>
  <p class="settings-note">Every mode and size keeps its own board. Your progress is saved on this device.</p>
  <button class="primary continue-button" id="continue">Back to puzzle</button>
 </dialog>
 <dialog id="modal" aria-labelledby="modal-heading"><div class="modal-top"><strong id="modal-heading">Circuit</strong><button id="close" class="round-button" aria-label="Close dialog">×</button></div><div id="modal-content"></div></dialog>
 <div id="toast" role="status"></div>
</body></html>
