<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf1f4"><meta name="description" content="Two-suit Spider Solitaire. All ten columns fit on your screen, with undo, hints and saved progress."><title>Spider Solitaire — games</title><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./spider.css?v=12"><script type="module" src="./spider.js?v=12"></script></head>
<body><div class="shell"><header><a class="brand" href="./games.html"><span class="spider-mark" aria-hidden="true">♠</span><h1>Spider Solitaire</h1></a><span class="two-suits">Two suits</span><button id="help" aria-label="How to play" title="How to play">?</button></header>
<main><div class="toolbar"><div class="stats"><span><b id="score">500</b>Score</span><span><b id="moves">0</b>Moves</span><span><b id="time">0:00</b>Time</span></div><div class="actions"><button id="undo" disabled><span aria-hidden="true">↶</span> Undo</button><button id="hint"><span aria-hidden="true">◇</span> Hint</button><button id="new">New deal</button></div></div>
<section class="table" aria-label="Spider Solitaire table"><div class="table-top"><button id="deal" class="deal"><span class="stock-packs" aria-hidden="true"></span><span id="deal-label">Deal · 5 left</span></button><div class="foundations" aria-label="Completed sequences"><div id="completed" class="completed"></div><strong id="progress">0 / 8</strong></div></div><div class="column-labels" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span></div><div class="table-scroll"><div id="board" class="board" aria-label="Ten card columns"></div></div><p id="message" role="status" aria-live="polite"></p><div id="win" hidden><h2>All eight cleared.</h2><p id="win-detail"></p><button id="play-again">Play again →</button></div></section>
<div class="table-foot"><span>Build K → A in one suit. Clear all eight runs.</span><span id="view-note">Tap a card, then its destination.</span></div></main></div>
<dialog id="modal"><div class="dialog-head"><strong id="dialog-title">Spider</strong><button id="close" aria-label="Close dialog">×</button></div><div id="dialog-body"></div></dialog></body></html>
